name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build renderer
        run: npm run build

      - name: Build and publish macOS app
        run: npx electron-builder --mac dmg --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build renderer
        run: npm run build

      - name: Build and publish Windows
        run: npx electron-builder --win nsis --x64 --publish always
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x64:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build renderer
        run: npm run build

      - name: Build Linux x64 AppImage
        run: npx electron-builder --linux AppImage --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flatpak remotes and Electron base
        run: |
          echo "Adding Flathub remote..."
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          echo "Installing Electron base app (x64)..."
          flatpak install -y flathub org.electronjs.Electron2.BaseApp/x86_64/24.08

      - name: Build Linux x64 Flatpak
        run: npx electron-builder --linux flatpak --x64 --publish always
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install QEMU for ARM64 builds
        run: |
          dnf install -y qemu-user-static

      - name: Install dependencies
        run: npm install

      - name: Build renderer
        run: npm run build

      - name: Build Linux arm64 AppImage
        run: npx electron-builder --linux AppImage --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flatpak remotes and Electron base
        run: |
          echo "Adding Flathub remote..."
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          echo "Installing arm64 Platform runtime..."
          flatpak install -y flathub org.freedesktop.Platform/aarch64/24.08 || echo "Platform already installed"
          echo "Installing arm64 SDK..."
          flatpak install -y flathub org.freedesktop.Sdk/aarch64/24.08
          echo "Installing Electron base app (arm64)..."
          flatpak install -y flathub org.electronjs.Electron2.BaseApp/aarch64/24.08

      - name: Build Linux arm64 Flatpak
        run: DEBUG="@malept/flatpak-bundler" npx electron-builder --linux flatpak --arm64 --publish always
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
