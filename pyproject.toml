[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kai-pack"
version = "1.0.0"
description = "KAI-Pack: Convert audio + lyrics to KAI karaoke format"
authors = [{name = "KAI Project"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "demucs>=4.0.0",
    "librosa>=0.10.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "mutagen>=1.45.0",
    "madmom>=0.16.0",
    "essentia>=2.1b6.dev374",
    "crepe>=0.0.12",
    "dtw-python>=1.2.0",
    "phonemizer>=3.0.0",
    "click>=8.0.0",
    "pydub>=0.25.0",
    "pyloudnorm>=0.1.0",
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20231117",
]

[project.scripts]
kai-pack = "kai_pack.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true